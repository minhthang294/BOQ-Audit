services:
  backend:
    image: ${IMAGE_REGISTRY:-boq-audit}/backend:${IMAGE_TAG:-local}
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      CODEX_HOME: /root/.codex
    volumes:
      - ./data:/data
      - codex_home:/root/.codex
      # Mount the complete skill bundle read-only; set this path per deployment host.
      - ${BOQ_AUDIT_SKILL_HOST_PATH:-/home/thangpham/.agents/skills/boq-audit}:/opt/codex/skills/boq-audit:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${IMAGE_REGISTRY:-boq-audit}/frontend:${IMAGE_TAG:-local}
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  chat:
    profiles: [chat]
    image: ${IMAGE_REGISTRY:-boq-audit}/chat:${IMAGE_TAG:-local}
    build: ./chat
    restart: unless-stopped
    environment:
      CHAT_GATEWAY_TOKEN: ${CHAT_GATEWAY_TOKEN:-}
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-120}
    volumes:
      - chat_auth:/auth:ro
      - chat_sessions:/sessions
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Copy only login credentials; the chat runtime never mounts the audit home or portal data.
  chat-auth-init:
    image: python:3.12-slim
    profiles: [chat-setup]
    network_mode: none
    volumes:
      - codex_home:/source:ro
      - chat_auth:/auth
    command: ["python", "-c", "import os, shutil; shutil.copyfile('/source/auth.json', '/auth/auth.json'); os.chown('/auth/auth.json', 10001, 10001); os.chmod('/auth/auth.json', 0o600)"]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  codex_home:
  chat_auth:
  chat_sessions:

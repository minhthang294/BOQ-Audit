services:
  backend:
    image: ${IMAGE_REGISTRY:-boq-audit}/backend:${IMAGE_TAG:-local}
    build: ./backend
    restart: unless-stopped
    env_file: .env
    user: "10001:10001"
    environment:
      HOME: /home/boq-audit
      CODEX_HOME: /home/boq-audit/.codex
    volumes:
      - ./data:/data
      - codex_home:/home/boq-audit/.codex
      # Mount the complete skill bundle read-only; set this path per deployment host.
      - ${BOQ_AUDIT_SKILL_HOST_PATH:?Set the absolute host path to the pinned boq-audit skill bundle}:/opt/codex/skills/boq-audit:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: ${IMAGE_REGISTRY:-boq-audit}/backend:${IMAGE_TAG:-local}
    build: ./backend
    command: ["python", "-m", "app.worker"]
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    env_file: .env
    user: "10001:10001"
    environment:
      HOME: /home/boq-audit
      CODEX_HOME: /home/boq-audit/.codex
    volumes:
      - ./data:/data
      - codex_home:/home/boq-audit/.codex
      - ${BOQ_AUDIT_SKILL_HOST_PATH:?Set the absolute host path to the pinned boq-audit skill bundle}:/opt/codex/skills/boq-audit:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
      - seccomp=./backend/security/codex-worker-seccomp.json
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  storage-owner:
    profiles: [storage-migration]
    image: ${IMAGE_REGISTRY:-boq-audit}/backend:${IMAGE_TAG:-local}
    build: ./backend
    user: "0:0"
    entrypoint: ["python", "/app/scripts/storage_owner.py"]
    command: ["--check"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./data:/data
      - codex_home:/codex-home

  frontend:
    image: ${IMAGE_REGISTRY:-boq-audit}/frontend:${IMAGE_TAG:-local}
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  chat:
    profiles: [chat]
    image: ${IMAGE_REGISTRY:-boq-audit}/chat:${IMAGE_TAG:-local}
    build: ./chat
    restart: unless-stopped
    environment:
      CHAT_GATEWAY_TOKEN: ${CHAT_GATEWAY_TOKEN:-}
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-300}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
    volumes:
      - chat_auth:/auth:ro
      - chat_sessions:/sessions
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Copy only login credentials; the chat runtime never mounts the audit home or portal data.
  chat-auth-init:
    image: python:3.12-slim
    profiles: [chat-setup]
    network_mode: none
    volumes:
      - codex_home:/source:ro
      - chat_auth:/auth
    command: ["python", "-c", "import os, shutil; shutil.copyfile('/source/auth.json', '/auth/auth.json'); os.chown('/auth/auth.json', 10001, 10001); os.chmod('/auth/auth.json', 0o600)"]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    networks:
      - default
      - sbtech-shared
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  codex_home:
  chat_auth:
  chat_sessions:

networks:
  # Shared with the SBTech CAD Studio stack: Caddy reaches the CAD container as
  # sbtech-cad:4173 after the /cad/ session check (docs/portal-cad.md).
  sbtech-shared:
    name: sbtech-shared

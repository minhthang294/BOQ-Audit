name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing release tag to roll back to; leave empty to build and deploy main.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: boq-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Backend tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          PYTHONPATH=. pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Deployment script syntax
        run: bash -n scripts/deploy-gce.sh

      - name: Deployment guard and rollback checks
        run: bash scripts/tests/test_deploy_gce.sh

  container-check:
    name: Build container images (PR)
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
      - name: Build chat image
        uses: docker/build-push-action@v7
        with:
          context: ./chat
          push: false
          cache-from: type=gha,scope=chat

  publish:
    name: Build and publish images
    needs: [checks, container-check]
    if: >-
      always() && needs.checks.result == 'success' && needs.container-check.result == 'skipped' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.image_tag == ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_BUILD_SERVICE_ACCOUNT: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate build configuration
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?Set repository variable GCP_PROJECT_ID}"
          : "${GCP_REGION:?Set repository variable GCP_REGION}"
          : "${AR_REPOSITORY:?Set repository variable AR_REPOSITORY}"
          : "${GCP_WIF_PROVIDER:?Set repository variable GCP_WIF_PROVIDER}"
          : "${GCP_BUILD_SERVICE_ACCOUNT:?Set repository variable GCP_BUILD_SERVICE_ACCOUNT}"
          [[ "$GCP_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || { echo "GCP_PROJECT_ID is invalid" >&2; exit 1; }
          [[ "$GCP_REGION" =~ ^[a-z0-9-]+$ ]] || { echo "GCP_REGION is invalid" >&2; exit 1; }
          [[ "$AR_REPOSITORY" =~ ^[a-z][a-z0-9-]{1,61}[a-z0-9]$ ]] || { echo "AR_REPOSITORY is invalid" >&2; exit 1; }

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/backend:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/frontend:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push chat
        uses: docker/build-push-action@v7
        with:
          context: ./chat
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/chat:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=chat
          cache-to: type=gha,mode=max,scope=chat

  deploy:
    name: Deploy to GCE
    needs: [checks, publish]
    if: >-
      always() && needs.checks.result == 'success' &&
      (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.image_tag != '')) &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCE_PROJECT_ID: ${{ vars.GCE_PROJECT_ID }}
      GCE_INSTANCE: ${{ vars.GCE_INSTANCE }}
      GCE_ZONE: ${{ vars.GCE_ZONE }}
      GCE_DEPLOY_PATH: ${{ vars.GCE_DEPLOY_PATH }}
      IMAGE_TAG: ${{ inputs.image_tag || format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?Set repository variable GCP_PROJECT_ID}"
          : "${GCP_REGION:?Set repository variable GCP_REGION}"
          : "${AR_REPOSITORY:?Set repository variable AR_REPOSITORY}"
          : "${GCP_WIF_PROVIDER:?Set repository variable GCP_WIF_PROVIDER}"
          : "${GCP_DEPLOY_SERVICE_ACCOUNT:?Set repository variable GCP_DEPLOY_SERVICE_ACCOUNT}"
          : "${GCE_INSTANCE:?Set repository variable GCE_INSTANCE}"
          : "${GCE_ZONE:?Set repository variable GCE_ZONE}"
          [[ "$GCP_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || { echo "GCP_PROJECT_ID is invalid" >&2; exit 1; }
          [[ "$GCP_REGION" =~ ^[a-z0-9-]+$ ]] || { echo "GCP_REGION is invalid" >&2; exit 1; }
          [[ "$AR_REPOSITORY" =~ ^[a-z][a-z0-9-]{1,61}[a-z0-9]$ ]] || { echo "AR_REPOSITORY is invalid" >&2; exit 1; }
          [[ "$GCE_INSTANCE" =~ ^[a-z]([-a-z0-9]*[a-z0-9])?$ ]] || { echo "GCE_INSTANCE is invalid" >&2; exit 1; }
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}-[0-9]{1,20}-[0-9]{1,3}$ ]] || { echo "image_tag must be a release tag (commit SHA-run ID-attempt)" >&2; exit 1; }
          GCE_DEPLOY_PATH="${GCE_DEPLOY_PATH:-/home/hello291994/BOQ-Audit}"
          [[ "$GCE_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$GCE_DEPLOY_PATH" != / && "$GCE_DEPLOY_PATH" != *..* ]] || { echo "GCE_DEPLOY_PATH must be a safe absolute application path" >&2; exit 1; }
          GCE_PROJECT_ID="${GCE_PROJECT_ID:-$GCP_PROJECT_ID}"
          [[ "$GCE_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || { echo "Set a valid GCE_PROJECT_ID or GCP_PROJECT_ID" >&2; exit 1; }

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCE_PROJECT_ID || vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCE_PROJECT_ID || vars.GCP_PROJECT_ID }}

      - name: Prepare deployment bundle
        run: |
          set -euo pipefail
          IMAGE_REGISTRY="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}"
          [[ "$IMAGE_REGISTRY" =~ ^[a-z0-9-]+-docker[.]pkg[.]dev/[a-z][a-z0-9-]{4,28}/[a-z][a-z0-9-]{2,62}$ ]] || { echo "Artifact Registry path is invalid" >&2; exit 1; }
          printf 'IMAGE_REGISTRY=%s\nIMAGE_TAG=%s\n' "$IMAGE_REGISTRY" "$IMAGE_TAG" > "$RUNNER_TEMP/deploy.env"
          chmod 600 "$RUNNER_TEMP/deploy.env"
          echo "IMAGE_REGISTRY=$IMAGE_REGISTRY" >> "$GITHUB_ENV"
          echo "GCE_PROJECT_ID=${GCE_PROJECT_ID:-$GCP_PROJECT_ID}" >> "$GITHUB_ENV"
          echo "GCE_DEPLOY_PATH=${GCE_DEPLOY_PATH:-/home/hello291994/BOQ-Audit}" >> "$GITHUB_ENV"

      - name: Copy deployment files and deploy over IAP
        run: |
          set -euo pipefail
          REMOTE_TMP="/tmp/boq-audit-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud compute ssh "$GCE_INSTANCE" --project "$GCE_PROJECT_ID" --zone "$GCE_ZONE" --tunnel-through-iap --quiet --command="mkdir -p '$REMOTE_TMP'"
          gcloud compute scp docker-compose.yml scripts/deploy-gce.sh "$RUNNER_TEMP/deploy.env" "$GCE_INSTANCE:$REMOTE_TMP/" --project "$GCE_PROJECT_ID" --zone "$GCE_ZONE" --tunnel-through-iap --quiet
          REMOTE_COMMAND="set -e; trap \"sudo rm -f $REMOTE_TMP/docker-compose.yml $REMOTE_TMP/deploy-gce.sh $REMOTE_TMP/deploy.env; rmdir $REMOTE_TMP 2>/dev/null || true\" EXIT; sudo install -d '$GCE_DEPLOY_PATH/scripts'; sudo install -m 0644 '$REMOTE_TMP/docker-compose.yml' '$GCE_DEPLOY_PATH/docker-compose.yml'; sudo install -m 0755 '$REMOTE_TMP/deploy-gce.sh' '$GCE_DEPLOY_PATH/scripts/deploy-gce.sh'; sudo install -m 0600 '$REMOTE_TMP/deploy.env' '$GCE_DEPLOY_PATH/.deploy.env'; sudo bash '$GCE_DEPLOY_PATH/scripts/deploy-gce.sh'"
          gcloud compute ssh "$GCE_INSTANCE" --project "$GCE_PROJECT_ID" --zone "$GCE_ZONE" --tunnel-through-iap --quiet --command="$REMOTE_COMMAND"

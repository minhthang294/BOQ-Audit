name: Diagnose chat gateway on GCE

on:
  workflow_dispatch:

permissions: {}

jobs:
  diagnose:
    name: Read chat gateway diagnostics
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCE_PROJECT_ID: ${{ vars.GCE_PROJECT_ID }}
      GCE_INSTANCE: ${{ vars.GCE_INSTANCE }}
      GCE_ZONE: ${{ vars.GCE_ZONE }}
      GCE_DEPLOY_PATH: ${{ vars.GCE_DEPLOY_PATH }}
    steps:
      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?Missing GCP_PROJECT_ID}"
          : "${GCP_REGION:?Missing GCP_REGION}"
          : "${GCP_WIF_PROVIDER:?Missing GCP_WIF_PROVIDER}"
          : "${GCP_DEPLOY_SERVICE_ACCOUNT:?Missing GCP_DEPLOY_SERVICE_ACCOUNT}"
          : "${GCE_INSTANCE:?Missing GCE_INSTANCE}"
          : "${GCE_ZONE:?Missing GCE_ZONE}"
          GCE_PROJECT_ID="${GCE_PROJECT_ID:-$GCP_PROJECT_ID}"
          GCE_DEPLOY_PATH="${GCE_DEPLOY_PATH:-/home/hello291994/BOQ-Audit}"
          [[ "$GCE_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          [[ "$GCE_INSTANCE" =~ ^[a-z]([-a-z0-9]*[a-z0-9])?$ ]]
          [[ "$GCE_ZONE" =~ ^[a-z0-9-]+$ ]]
          [[ "$GCE_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$GCE_DEPLOY_PATH" != / && "$GCE_DEPLOY_PATH" != *..* ]]
          echo "GCE_PROJECT_ID=$GCE_PROJECT_ID" >> "$GITHUB_ENV"
          echo "GCE_DEPLOY_PATH=$GCE_DEPLOY_PATH" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCE_PROJECT_ID || vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCE_PROJECT_ID || vars.GCP_PROJECT_ID }}

      - name: Read sanitized VM diagnostics
        run: |
          set -euo pipefail
          REMOTE_COMMAND=$(cat <<EOF
          set -euo pipefail
          sudo docker compose --project-directory "$GCE_DEPLOY_PATH" -f "$GCE_DEPLOY_PATH/docker-compose.yml" --profile chat ps
          sudo python3 -c 'from pathlib import Path; import hashlib; p=Path("/home/hello291994_gmail_com/.codex/auth.json"); print("vm_user_auth=" + ("present" if p.is_file() else "missing")); print("vm_user_auth_mtime=" + (str(int(p.stat().st_mtime)) if p.is_file() else "none")); print("vm_user_auth_digest=" + (hashlib.sha256(p.read_bytes()).hexdigest()[:12] if p.is_file() else "none"))'
          sudo docker compose --project-directory "$GCE_DEPLOY_PATH" -f "$GCE_DEPLOY_PATH/docker-compose.yml" exec -T backend python -c 'from pathlib import Path; import hashlib; p=Path("/root/.codex/auth.json"); print("backend_auth_mtime=" + (str(int(p.stat().st_mtime)) if p.is_file() else "none")); print("backend_auth_digest=" + (hashlib.sha256(p.read_bytes()).hexdigest()[:12] if p.is_file() else "none"))'
          sudo docker compose --project-directory "$GCE_DEPLOY_PATH" -f "$GCE_DEPLOY_PATH/docker-compose.yml" --profile chat exec -T chat python -c 'from pathlib import Path; import hashlib; p=Path("/auth/auth.json"); print("chat_auth_mtime=" + (str(int(p.stat().st_mtime)) if p.is_file() else "none")); print("chat_auth_digest=" + (hashlib.sha256(p.read_bytes()).hexdigest()[:12] if p.is_file() else "none"))'
          sudo docker compose --project-directory "$GCE_DEPLOY_PATH" -f "$GCE_DEPLOY_PATH/docker-compose.yml" --profile chat exec -T chat python -c 'import os; from pathlib import Path; print("codex_auth_file=" + ("present" if Path("/auth/auth.json").is_file() else "missing")); print("opencode_api_key=" + ("present" if bool(os.getenv("OPENCODE_API_KEY")) else "missing")); print("fallback_enabled=" + os.getenv("CHAT_FALLBACK_ENABLED", "true").lower())'
          sudo docker compose --project-directory "$GCE_DEPLOY_PATH" -f "$GCE_DEPLOY_PATH/docker-compose.yml" --profile chat exec -T chat python -c 'import asyncio, json, os, shutil, subprocess, tempfile; from pathlib import Path; import sys; sys.path.insert(0, "/app"); import gateway; root=Path(tempfile.mkdtemp(prefix="codex-probe-", dir="/tmp")); home=root/"home"; workspace=root/"workspace"; home.mkdir(); workspace.mkdir(); shutil.copyfile("/auth/auth.json", home/"auth.json"); (home/"config.toml").write_text(gateway.config_text(workspace, home)); env={"PATH":os.environ.get("PATH", "/usr/local/bin:/usr/bin:/bin"), "HOME":str(root), "CODEX_HOME":str(home), "TMPDIR":"/tmp"}; result=None; reason="provider_error"; chars=0
          try:
              result=subprocess.run(["codex", "exec", "--json", "--ephemeral", "--sandbox", "read-only", "--skip-git-repo-check", "-C", str(workspace), "-"], input="Trả lời chính xác bằng một từ: OK", text=True, capture_output=True, env=env, timeout=90)
              for line in result.stdout.splitlines():
                  try: event=json.loads(line)
                  except ValueError: continue
                  item=event.get("item") or {}
                  if event.get("type")=="item.completed" and item.get("type") in ("agent_message", "agentMessage"): chars += len(item.get("text", ""))
              detail=(result.stderr+result.stdout).lower()
              reason="workspace_routing" if "workspace routing" in detail else "provider_auth" if "unauthorized" in detail or "401" in detail else "rate_limit" if "429" in detail or "rate limit" in detail else "cli_error" if "unexpected argument" in detail or "unrecognized option" in detail else "provider_error"
              if result.returncode==0 and chars: reason="success"
          except subprocess.TimeoutExpired: reason="timeout"
          finally: shutil.rmtree(root, ignore_errors=True)
          print("codex_exec_probe="+reason); print("codex_exec_response_chars="+str(chars))'
          sudo docker compose --project-directory "$GCE_DEPLOY_PATH" -f "$GCE_DEPLOY_PATH/docker-compose.yml" --profile chat exec -T chat python -c 'exec("import json,os,secrets,shutil,sys,urllib.error,urllib.request\nsys.path.insert(0, \"/app\")\nimport gateway\nkey=secrets.token_hex(32)\nbody=json.dumps({\"session_key\":key,\"context\":{\"task\":\"excel_explain\"},\"history\":[],\"message\":\"Trả lời chính xác bằng một từ: OK\"}).encode()\nreq=urllib.request.Request(\"http://127.0.0.1:8010/reply\",data=body,headers={\"Authorization\":\"Bearer \"+os.environ[\"CHAT_GATEWAY_TOKEN\"],\"Content-Type\":\"application/json\"})\nreason=\"provider_error\"\nchars=0\ntry:\n response=json.load(urllib.request.urlopen(req,timeout=180))\n chars=len(response.get(\"text\",\"\"))\n reason=\"success\" if chars else \"empty_reply\"\nexcept urllib.error.HTTPError as e:\n reason=\"http_\"+str(e.code)\nexcept Exception as e:\n reason=\"error_\"+type(e).__name__\nfinally:\n shutil.rmtree(gateway.SESSION_ROOT/key,ignore_errors=True)\nprint(\"chat_reply_probe=\"+reason)\nprint(\"chat_reply_response_chars=\"+str(chars))")'
          sudo docker compose --project-directory "$GCE_DEPLOY_PATH" -f "$GCE_DEPLOY_PATH/docker-compose.yml" --profile chat logs --since=24h --tail=2000 chat | grep -E 'chat_turn_incomplete|chat_turn_failed|opencode_model_failed' | tail -100 || true
          EOF
          )
          gcloud compute ssh "$GCE_INSTANCE" --project "$GCE_PROJECT_ID" --zone "$GCE_ZONE" --tunnel-through-iap --quiet --command="$REMOTE_COMMAND"
